name: EasyLiteRoom CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Print Developer Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build EasyLiteRoom
        run: |
          xcodebuild -scheme EasyLiteRoom \
                     -destination 'platform=macOS' \
                     clean build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=""

      - name: Run Unit Tests
        run: |
          xcodebuild -scheme EasyLiteRoom \
                     -destination 'platform=macOS' \
                     -only-testing:EasyLiteRoomTests \
                     test \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_STYLE=Manual \
                     DEVELOPMENT_TEAM=""
